[project]
name = "ape-tenderly-v2"
version = "0.1.0"
description = "Ape plugin for Tenderly: Virtual TestNet test provider (snapshot, impersonation, cheats), Node RPC gateway provider, simulation API, dashboard explorer, and a vnets CLI"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["ethereum", "ape", "tenderly", "virtual-testnet", "fork", "simulation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "eth-ape>=0.8.21,<0.9",
    "click>=8.1",
]

[project.optional-dependencies]
test = ["pytest>=7", "pytest-xdist>=3"]
lint = ["ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://github.com/alchemix-finance/ape-tenderly-v2"
Issues = "https://github.com/alchemix-finance/ape-tenderly-v2/issues"

[project.entry-points.ape_cli_subcommands]
ape_tenderly_v2 = "ape_tenderly_v2._cli:cli"

[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ape_tenderly_v2*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:ape_test"

[tool.ruff]
line-length = 100
target-version = "py310"
